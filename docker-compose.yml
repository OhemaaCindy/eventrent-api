services:
  postgres:
    image: postgres:16-alpine
    container_name: eventrent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventrent
      POSTGRES_PASSWORD: eventrent_dev_password
      POSTGRES_DB: eventrent
    ports:
      - "5433:5432"
    volumes:
      - eventrent-db-data:/var/lib/postgresql/data

volumes:
  eventrent-db-data: